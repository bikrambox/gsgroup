[uwsgi]
; Path to your project directory
chdir = ${APP_PATH}
; Python module containing the WSGI application
module = app:app
; Enable master process
master = true
; Number of worker processes
processes = ${WORKERS}
; Socket to communicate with Nginx
socket = 127.0.0.1:${PORT}
; Socket permissions
chmod-socket = 660
; Clean up socket when process stops
vacuum = true
; Kill workers after this many seconds
harakiri = ${TIMEOUT}
; Reload workers after this many requests
max-requests = ${MAX_REQUESTS}
; Ensure threads work properly
enable-threads = true
; Log to file
logto = ${LOG_DIR}/uwsgi.log
; Die on SIGTERM
die-on-term = true
