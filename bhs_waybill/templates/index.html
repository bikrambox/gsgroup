<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHS Waybill Download Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .download-button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 18px;
            margin: 20px 0;
            transition: background-color 0.3s;
        }
        .download-button:hover {
            background-color: #45a049;
        }
        .url-display {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 4px;
            word-break: break-all;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BHS Waybill Download Test</h1>
        
        <p>Click the button below to download the test file:</p>
        
        <a href="https://vps1139.basicserver.io:42030/api/ftp/download/Reports/ELON_data/Nomeco_environments/PROD_internally/Nomeco_2024-10-16/20241016163203_BZ761831_Final.csv" 
           class="download-button" 
           id="downloadButton" 
           target="_blank">
            Download Test File
        </a>
        
        <div class="url-display">
            <strong>Download URL:</strong><br>
            https://vps1139.basicserver.io:42030/api/ftp/download/Reports/ELON_data/Nomeco_environments/PROD_internally/Nomeco_2024-10-16/20241016163203_BZ761831_Final.csv
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        // Function to automatically trigger download when page loads
        window.onload = function() {
            // Wait a moment before triggering the download
            setTimeout(function() {
                console.log("Auto-triggering download...");
                document.getElementById("downloadButton").click();
            }, 1000);
        };

        // Function to manually download the file
        function downloadFile() {
            const url = "https://vps1139.basicserver.io:42030/api/ftp/download/Reports/ELON_data/Nomeco_environments/PROD_internally/Nomeco_2024-10-16/20241016163203_BZ761831_Final.csv";
            console.log("Manual download initiated for URL:", url);
            
            fetch(url, {
                method: 'GET',
                mode: 'cors',
                headers: {
                    'Accept': 'text/csv'
                }
            })
            .then(response => {
                console.log("Response status:", response.status);
                console.log("Response headers:", Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                return response.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = "20241016163203_BZ761831_Final.csv";
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                
                const statusDiv = document.getElementById("status");
                statusDiv.className = "status success";
                statusDiv.textContent = "Download successful!";
            })
            .catch(error => {
                console.error("Download error:", error);
                
                const statusDiv = document.getElementById("status");
                statusDiv.className = "status error";
                statusDiv.textContent = `Download failed: ${error.message}`;
            });
        }
    </script>
</body>
</html>
