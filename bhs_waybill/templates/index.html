<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHS Waybill FTPS File Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .file-manager {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .indexing-status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 3px;
            color: white;
        }
        .indexing-ongoing {
            background-color: red;
        }
        .indexing-done {
            background-color: green;
        }
        .search-container {
            margin-bottom: 20px;
        }
        #searchInput {
            width: 70%;
            padding: 8px;
            margin-right: 10px;
            box-sizing: border-box;
        }
        #searchButton {
            padding: 8px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #searchButton:hover {
            background-color: #0056b3;
        }
        .breadcrumbs {
            margin-bottom: 10px;
            font-weight: bold;
        }
        .breadcrumb {
            display: inline-block;
            color: #333;
            text-decoration: none;
            padding: 2px 5px;
        }
        .breadcrumb:not(:last-child):after {
            content: " / ";
            color: #666;
            margin: 0 5px;
        }
        .breadcrumb:hover {
            text-decoration: underline;
            cursor: pointer;
        }
        .breadcrumb.active {
            color: #666;
            pointer-events: none;
        }
        .item-list {
            list-style: none;
            padding: 0;
        }
        .item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .item.dir {
            color: blue;
        }
        .item.file {
            color: black;
        }
        .item:hover {
            background-color: #f5f5f5;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        #fileViewer {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            max-height: 400px; /* Fixed height for the table */
            overflow-y: auto; /* Enable vertical scrolling */
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .files-column {
            display: flex;
            flex-direction: column; /* Stack files vertically */
            gap: 5px; /* Spacing between files */
        }
        .file-item {
            color: black;
            cursor: pointer;
        }
        .file-item:hover {
            text-decoration: underline;
        }
        .download-link {
            color: #007BFF;
            text-decoration: underline;
            cursor: pointer;
            margin-left: 5px;
        }
        .download-link:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="file-manager">
        <h1>BHS Waybill FTPS File Manager</h1>
        <div class="indexing-status" id="indexingStatus">Indexing <span id="statusText">[Ongoing]</span></div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search file names (e.g., BZ760919)...">
            <button id="searchButton">Search</button>
        </div>
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <ul class="item-list" id="fileList"></ul>
        <div class="error" id="errorMessage"></div>
        <div id="fileViewer"></div>
        <table id="searchResultsTable">
            <thead>
                <tr>
                    <th>Name of the Folder</th>
                    <th>Files</th>
                </tr>
            </thead>
            <tbody id="searchResultsBody"></tbody>
        </table>
    </div>

    <script>
        const baseUrl = 'https://vps1139.basicserver.io:42030'; // Update with your server URL
        let currentPath = '/Reports/ELON_data/Nomeco_environments/PROD_internally';

        // Initialize IndexedDB for storing file index
        let db;
        const request = indexedDB.open('ftpIndexDB', 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            db.createObjectStore('files', { keyPath: 'file_name' });
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            loadIndexFromServer();
            startPollingIndexingStatus();
        };

        request.onerror = function(event) {
            console.error("IndexedDB error:", event.target.error);
        };

        async function loadIndexFromServer() {
            try {
                const response = await fetch(`${baseUrl}/api/ftp/index`);
                if (!response.ok) throw new Error('Failed to fetch index');
                const blob = await response.blob();
                const reader = new FileReader();
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    const sqliteData = new Uint8Array(arrayBuffer);
                    parseSQLiteData(sqliteData);
                };
                reader.readAsArrayBuffer(blob);
            } catch (error) {
                console.error("Error loading index from server:", error);
            }
        }

        function parseSQLiteData(sqliteData) {
            // Simplified approach; replace with actual SQLite parsing or server-side JSON conversion
            const transaction = db.transaction(['files'], 'readwrite');
            const store = transaction.objectStore('files');
            
            const jsonData = [
                { file_name: "20241002000000_BZ760919_Investigate.csv", file_path: "/Reports/ELON_data/Nomeco_environments/PROD_internally/Nomeco_2024-10-02/20241002000000_BZ760919_Investigate.csv" },
                { file_name: "20241002000000_BZ760919_Investigate.pdf", file_path: "/Reports/ELON_data/Nomeco_environments/PROD_internally/Nomeco_2024-10-02/20241002000000_BZ760919_Investigate.pdf" },
                { file_name: "20241002000000_BZ760919_Investigate.txt", file_path: "/Reports/ELON_data/Nomeco_environments/PROD_internally/Nomeco_2024-10-02/20241002000000_BZ760919_Investigate.txt" },
                { file_name: "BZ760919_ArgumentList.txt", file_path: "/Reports/ELON_data/Nomeco_environments/PROD_internally/Nomeco_2024-10-02/BZ760919_ArgumentList.txt" }
            ];

            jsonData.forEach(item => {
                store.put(item);
            });

            console.log("IndexedDB populated with FTP index");
        }

        async function loadDirectory(path = currentPath) {
            console.log("Loading directory for path - Input:", path, "Global currentPath:", currentPath);
            try {
                const response = await fetch(`${baseUrl}/api/ftp/list?path=${encodeURIComponent(path)}`);
                const data = await response.json();

                if (data.status === 'error') {
                    document.getElementById('errorMessage').textContent = data.message;
                    document.getElementById('fileList').innerHTML = '';
                    document.getElementById('fileViewer').innerHTML = '';
                    console.error("Failed to load directory:", data.message, "Requested path:", path);
                    return;
                }

                document.getElementById('errorMessage').textContent = '';
                updateBreadcrumbs(path);
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '';

                data.data.forEach(item => {
                    const li = document.createElement('li');
                    li.className = `item ${item.is_dir ? 'dir' : 'file'}`;
                    li.textContent = item.name;
                    li.onclick = () => {
                        if (item.is_dir) {
                            currentPath = item.path;
                            console.log("Navigating to directory - New currentPath:", currentPath, "Item path:", item.path);
                            loadDirectory(currentPath);
                        } else {
                            viewFile(item.path);
                        }
                    };
                    fileList.appendChild(li);
                });
            } catch (error) {
                document.getElementById('errorMessage').textContent = 'Failed to load directory: ' + error.message;
                console.error("Fetch error:", error, "Requested path:", path);
            }
        }

        async function viewFile(filePath) {
            console.log("Viewing file:", filePath);
            try {
                const response = await fetch(`${baseUrl}/api/ftp/download/${encodeURIComponent(filePath)}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const contentType = response.headers.get('content-type');
                const data = await response.blob(); // Use blob for downloading files

                const fileViewer = document.getElementById('fileViewer');
                fileViewer.innerHTML = '';

                // Display file in viewer or offer download
                if (contentType === 'application/pdf') {
                    // Use an iframe for PDF viewing and add download link
                    const iframe = document.createElement('iframe');
                    iframe.src = URL.createObjectURL(data);
                    iframe.width = '100%';
                    iframe.height = '500px';
                    fileViewer.appendChild(iframe);

                    const downloadLink = document.createElement('a');
                    downloadLink.textContent = 'Download PDF';
                    downloadLink.className = 'download-link';
                    downloadLink.href = URL.createObjectURL(data);
                    downloadLink.download = filePath.split('/').pop();
                    fileViewer.appendChild(downloadLink);
                } else if (contentType === 'text/csv') {
                    // Parse CSV and display as table, with download link
                    const text = await response.text();
                    const rows = text.trim().split('\n').map(row => row.split(','));
                    const table = document.createElement('table');
                    rows.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        row.forEach(cell => {
                            const td = document.createElement(index === 0 ? 'th' : 'td');
                            td.textContent = cell.trim();
                            tr.appendChild(td);
                        });
                        table.appendChild(tr);
                    });
                    fileViewer.appendChild(table);

                    const downloadLink = document.createElement('a');
                    downloadLink.textContent = 'Download CSV';
                    downloadLink.className = 'download-link';
                    downloadLink.href = URL.createObjectURL(data);
                    downloadLink.download = filePath.split('/').pop();
                    fileViewer.appendChild(downloadLink);
                } else if (contentType === 'text/plain') {
                    // Display plain text, with download link
                    const pre = document.createElement('pre');
                    pre.textContent = await response.text();
                    fileViewer.appendChild(pre);

                    const downloadLink = document.createElement('a');
                    downloadLink.textContent = 'Download TXT';
                    downloadLink.className = 'download-link';
                    downloadLink.href = URL.createObjectURL(data);
                    downloadLink.download = filePath.split('/').pop();
                    fileViewer.appendChild(downloadLink);
                } else {
                    fileViewer.textContent = 'Unsupported file type';
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = 'Failed to load file: ' + error.message;
                console.error("File viewing error:", error);
            }
        }

        function updateBreadcrumbs(path) {
            console.log("Updating breadcrumbs for path:", path);
            const parts = path.split('/').filter(part => part.length > 0);
            const breadcrumbs = document.getElementById('breadcrumbs');
            breadcrumbs.innerHTML = '';

            let cumulativePath = '/';
            parts.forEach((part, index) => {
                // Build the cumulative path up to this part
                const currentPath = cumulativePath + part;
                if (index < parts.length - 1) {
                    cumulativePath = currentPath + '/';
                } else {
                    cumulativePath = currentPath;
                }

                const breadcrumb = document.createElement('a');
                breadcrumb.className = 'breadcrumb';
                breadcrumb.textContent = part;

                if (index === parts.length - 1) {
                    breadcrumb.classList.add('active');
                    console.log("Active breadcrumb (current directory):", currentPath);
                } else {
                    breadcrumb.href = '#';
                    breadcrumb.onclick = (e) => {
                        e.preventDefault();
                        console.log("Clicked breadcrumb - Before update:", currentPath, "Global currentPath:", window.currentPath);
                        window.currentPath = currentPath; // Use window.currentPath to ensure global scope
                        console.log("Clicked breadcrumb - After update:", window.currentPath);
                        loadDirectory(window.currentPath);
                    };
                }

                breadcrumbs.appendChild(breadcrumb);
            });

            // Add "Home" breadcrumb as the first item
            if (parts.length > 0) {
                const homeBreadcrumb = document.createElement('a');
                homeBreadcrumb.className = 'breadcrumb';
                homeBreadcrumb.textContent = 'Home';
                homeBreadcrumb.href = '#';
                homeBreadcrumb.onclick = (e) => {
                    e.preventDefault();
                    console.log("Clicked Home breadcrumb, navigating to root. Current global currentPath:", window.currentPath);
                    window.currentPath = '/'; // Adjust this to the root FTP directory if different
                    console.log("Clicked Home breadcrumb, new currentPath:", window.currentPath);
                    loadDirectory(window.currentPath);
                };
                breadcrumbs.insertBefore(homeBreadcrumb, breadcrumbs.firstChild);

                // Add separators after "Home"
                const separator = document.createTextNode(' / ');
                breadcrumbs.insertBefore(separator, breadcrumbs.childNodes[1]);
            }
        }

        function searchFiles() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const transaction = db.transaction(['files'], 'readonly');
            const store = transaction.objectStore('files');
            const request = store.openCursor();
            const results = {};

            request.onsuccess = function(event) {
                const cursor = event.target.result;
                if (cursor) {
                    const file = cursor.value;
                    const folderName = file.file_path.split('/').slice(-2, -1)[0] || 'Root'; // Get Daily_data folder name
                    if (file.file_name.toLowerCase().includes(searchTerm)) {
                        if (!results[folderName]) {
                            results[folderName] = [];
                        }
                        results[folderName].push(file.file_name);
                    }
                    cursor.continue();
                } else {
                    displaySearchResults(results);
                }
            };

            request.onerror = function(event) {
                console.error("Search error:", event.target.error);
            };
        }

        function displaySearchResults(results) {
            const tbody = document.getElementById('searchResultsBody');
            tbody.innerHTML = '';

            for (const folderName in results) {
                const tr = document.createElement('tr');
                const folderCell = document.createElement('td');
                folderCell.textContent = folderName;

                const filesCell = document.createElement('td');
                const filesContainer = document.createElement('div');
                filesContainer.className = 'files-column';
                results[folderName].forEach(file => {
                    const fileItem = document.createElement('span');
                    fileItem.className = 'file-item';
                    fileItem.textContent = file;

                    // Add download link next to file name
                    const downloadLink = document.createElement('a');
                    downloadLink.textContent = ' (Download)';
                    downloadLink.className = 'download-link';
                    downloadLink.href = `${baseUrl}/api/ftp/download/${encodeURIComponent(`/Reports/ELON_data/Nomeco_environments/PROD_internally/${folderName}/${file}`)}`;
                    downloadLink.download = file;

                    fileItem.appendChild(document.createTextNode(' '));
                    fileItem.appendChild(downloadLink);

                    fileItem.onclick = (e) => {
                        e.preventDefault(); // Prevent default link behavior if needed
                        viewFile(`/Reports/ELON_data/Nomeco_environments/PROD_internally/${folderName}/${file}`);
                    };
                    filesContainer.appendChild(fileItem);
                });
                filesCell.appendChild(filesContainer);

                tr.appendChild(folderCell);
                tr.appendChild(filesCell);
                tbody.appendChild(tr);
            }
        }

        // Add search event listener
        document.getElementById('searchButton').addEventListener('click', searchFiles);

        async function updateIndexingStatus() {
            try {
                const response = await fetch(`${baseUrl}/api/indexing_status`);
                if (!response.ok) throw new Error('Failed to fetch indexing status');
                const data = await response.json();
                const statusElement = document.getElementById('statusText');
                const statusDiv = document.getElementById('indexingStatus');
                
                if (data.status === 'ongoing') {
                    statusElement.textContent = '[Ongoing]';
                    statusDiv.className = 'indexing-status indexing-ongoing';
                } else if (data.status === 'done') {
                    statusElement.textContent = '[Done]';
                    statusDiv.className = 'indexing-status indexing-done';
                }
            } catch (error) {
                console.error("Error updating indexing status:", error);
                document.getElementById('statusText').textContent = '[Error]';
                document.getElementById('indexingStatus').className = 'indexing-status indexing-ongoing';
            }
        }

        function startPollingIndexingStatus() {
            updateIndexingStatus(); // Initial check
            setInterval(updateIndexingStatus, 5000); // Poll every 5 seconds
        }

        // Load initial directory
        window.onload = () => loadDirectory();
    </script>
</body>
</html>
