[uwsgi]
# Set the working directory to the Django project root
chdir = /var/www/html/gsgroup

# Specify the WSGI module (ensure this matches your project name)
module = djangovue.wsgi:application

# Set the virtual environment path
home = /var/www/html/gsgroup/apienv

# Enable the master process for better worker management
master = true

# Number of worker processes (adjust based on server resources)
processes = 4

# Socket file for communication with Nginx
socket = /var/www/html/gsgroup/gsgroup.sock
chmod-socket = 664

# Clean up socket file on shutdown
vacuum = true

# Terminate uWSGI when receiving SIGTERM
die-on-term = true

# Run as the appropriate user and group (match Nginx user)
uid = www-data
gid = www-data

# Log to a secure location
logto = /var/www/html/gsgroup/emperor.log