[uwsgi]
chdir = /home/user/Documents/

module = djangovue.wsgi

home = /home/user/Documents/denv

master = true
processes = 4

socket = /home/user/Documents/uwsgi.sock
chmod-socket = 666

http = :8000

vacuum = true
die-on-term = true

uid = user  # Add this
gid = www-data  # Add this

daemonize = /home/user/Documents/uwsgi-emperor.log